name: DNSGuard CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y bind9-utils
      - run: go test ./...
        working-directory: server
      - run: go test -race ./...
        working-directory: server
      - run: go vet ./...
        working-directory: server

  shell-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -x install.sh scripts/*.sh tests/*.sh tests/e2e/*.sh tests/bind-cluster/*.sh tests/bind-cluster/global-deny-acceptance/*.sh tests/upgrade-rollback.sh
      - run: bash -n install.sh scripts/*.sh tests/*.sh tests/e2e/*.sh tests/bind-cluster/*.sh tests/bind-cluster/global-deny-acceptance/*.sh tests/upgrade-rollback.sh
      - run: DNSGUARD_ENV_FILE=./deploy/docker/dnsguard.env.example docker compose --env-file deploy/docker/dnsguard.env.example -f compose.yaml config
      - run: bash tests/network-exposure.sh

  bind-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y bind9-dnsutils bind9-utils
      - name: Fetch current IANA TLD snapshot
        run: curl --fail --location --retry 2 https://data.iana.org/TLD/tlds-alpha-by-domain.txt -o "$RUNNER_TEMP/iana-tlds-alpha-by-domain.txt"
      - run: TLD_FIXTURE_COUNT=1436 TLD_FIXTURE_FILE="$RUNNER_TEMP/iana-tlds-alpha-by-domain.txt" TEST_RUN_USER="$USER" bash ./tests/bind-cluster/run-acceptance.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bind-acceptance-evidence
          path: |
            tests/bind-cluster/runtime/acceptance-report.md
            tests/bind-cluster/runtime/evidence/
            tests/bind-cluster/runtime/docker-compose.log
            tests/bind-cluster/runtime/*/api*.log
            tests/bind-cluster/runtime/*/one.code
            tests/bind-cluster/runtime/*/two.code
            tests/bind-cluster/runtime/*/job.json
            tests/bind-cluster/runtime/*/rules.json
            tests/bind-cluster/runtime/*/publish.json
          if-no-files-found: warn

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:setup-wizard
      - run: npx playwright install chromium
      - run: npm run test:ui
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/

  e2e-real:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y bind9-dnsutils bind9-utils
      - run: npx playwright install --with-deps chromium
      - run: bash tests/e2e/run-all.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-e2e-evidence
          path: |
            tests/e2e/runtime/*/acceptance-report.md
            tests/e2e/runtime/*/evidence/
            playwright-report/
            test-results/
          if-no-files-found: warn

  upgrade-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run isolated v1.1.1 to candidate upgrade and snapshot rollback
        run: UPGRADE_BASELINE_REF=v1.1.1 UPGRADE_CURRENT_REF=HEAD UPGRADE_HOST_PORT=18881 bash tests/upgrade-rollback.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-rollback-evidence
          path: |
            tests/upgrade-runtime/*/upgrade-rollback-report.md
            tests/upgrade-runtime/*/evidence/
            tests/upgrade-runtime/*/*-container.log
            tests/upgrade-runtime/*/build-*.log
          if-no-files-found: warn

  daily-regression-report:
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: [go, shell-and-compose, bind-integration, web, e2e-real, upgrade-rollback]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Write regression report and update deduplicated issue on failure
        env:
          REGRESSION_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REGRESSION_GO_RESULT: ${{ needs.go.result }}
          REGRESSION_SHELL_RESULT: ${{ needs.shell-and-compose.result }}
          REGRESSION_BIND_RESULT: ${{ needs.bind-integration.result }}
          REGRESSION_WEB_RESULT: ${{ needs.web.result }}
          REGRESSION_E2E_RESULT: ${{ needs.e2e-real.result }}
          REGRESSION_UPGRADE_RESULT: ${{ needs.upgrade-rollback.result }}
        run: scripts/daily-regression-report.sh "$RUNNER_TEMP/dnsguard-daily-regression.md"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-regression-report
          path: ${{ runner.temp }}/dnsguard-daily-regression.md
          if-no-files-found: warn
