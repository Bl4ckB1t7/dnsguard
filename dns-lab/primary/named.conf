include "/etc/bind/dns-ops-lab/rpz-manager.key";

options {
    directory "/var/lib/bind/dns-ops-lab/primary";
    listen-on port 5353 { 127.0.0.2; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { 127.0.0.0/8; };
    allow-recursion { 127.0.0.0/8; };
    forwarders { 127.0.0.54; };
    forward only;
    dnssec-validation no;
    response-policy { zone "rpz.local"; };
    pid-file "/var/lib/bind/dns-ops-lab/primary/named.pid";
    session-keyfile "/var/lib/bind/dns-ops-lab/primary/session.key";
};

controls { };

logging {
    channel lab_log {
        file "/var/log/named/dns-ops-lab/primary.log" versions 3 size 5m;
        severity info;
        print-time yes;
    };
    category default { lab_log; };
    category queries { lab_log; };
    category rpz { lab_log; };
};

zone "rpz.local" {
    type primary;
    file "/var/lib/bind/dns-ops-lab/primary/rpz.local.zone";
    allow-update { key rpz-manager; };
    allow-transfer { 127.0.0.0/8; };
    notify yes;
    also-notify { 127.0.0.3 port 5353; };
};
