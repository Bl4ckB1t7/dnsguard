name: dnsguard-production-bind

services:
  bind-primary:
    image: internetsystemsconsortium/bind9:9.20
    container_name: prod-bind-primary
    command: ["-f", "-g", "-c", "/etc/bind/named.conf"]
    ports:
      - "127.0.0.1:16353:53/tcp"
      - "127.0.0.1:16353:53/udp"
    networks:
      prod-bind:
        ipv4_address: 172.31.0.10
    volumes:
      - ./config/primary/named.conf:/etc/bind/named.conf:ro
      - ./runtime/keys:/etc/bind/keys:ro
      - ./runtime/primary-data:/var/lib/bind/primary
      - ./runtime/primary-logs:/var/log/bind

  bind-secondary-1:
    image: internetsystemsconsortium/bind9:9.20
    container_name: prod-bind-secondary-1
    command: ["-f", "-g", "-c", "/etc/bind/named.conf"]
    ports:
      - "127.0.0.1:16354:53/tcp"
      - "127.0.0.1:16354:53/udp"
    networks:
      prod-bind:
        ipv4_address: 172.31.0.11
    volumes:
      - ./config/secondary/named.conf:/etc/bind/named.conf:ro
      - ./runtime/secondary-1-data:/var/lib/bind/secondary
      - ./runtime/secondary-1-logs:/var/log/bind

  bind-secondary-2:
    image: internetsystemsconsortium/bind9:9.20
    container_name: prod-bind-secondary-2
    command: ["-f", "-g", "-c", "/etc/bind/named.conf"]
    ports:
      - "127.0.0.1:16355:53/tcp"
      - "127.0.0.1:16355:53/udp"
    networks:
      prod-bind:
        ipv4_address: 172.31.0.12
    volumes:
      - ./config/secondary-2/named.conf:/etc/bind/named.conf:ro
      - ./runtime/secondary-2-data:/var/lib/bind/secondary
      - ./runtime/secondary-2-logs:/var/log/bind

networks:
  prod-bind:
    name: dnsguard-prod-bind-acceptance
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/24
