options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    dnssec-validation no;
    forward only;
    forwarders { 172.31.0.12; };
    response-policy { zone "rpz.local"; };
};
logging {
    channel cluster_log { file "/var/log/bind/cluster.log" versions 3 size 5m; severity info; print-time yes; print-category yes; print-severity yes; };
    category default { cluster_log; };
    category notify { cluster_log; };
    category xfer-in { cluster_log; };
};
zone "rpz.local" {
    type secondary;
    primaries { 172.31.0.10; };
    file "/var/lib/bind/secondary/rpz.local.zone";
    allow-notify { 172.31.0.10; };
};
