options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion yes;
    allow-query { any; };
    allow-recursion { any; };
    dnssec-validation no;
    response-policy { zone "rpz.local"; };
    notify yes;
    also-notify { 172.30.0.11; 172.30.0.12; };
};

logging {
    channel cluster_log {
        file "/var/log/bind/cluster.log" versions 3 size 5m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };
    category default { cluster_log; };
    category update { cluster_log; };
    category notify { cluster_log; };
    category xfer-in { cluster_log; };
    category xfer-out { cluster_log; };
};

include "/etc/bind/keys/rpz-manager.key";

zone "rpz.local" {
    type primary;
    file "/var/lib/bind/primary/rpz.local.zone";
    allow-update { key rpz-manager; };
    allow-transfer { 172.30.0.11; 172.30.0.12; };
    notify yes;
};

zone "app.test" {
    type primary;
    file "/var/lib/bind/primary/app.test.zone";
    allow-query { any; };
};
