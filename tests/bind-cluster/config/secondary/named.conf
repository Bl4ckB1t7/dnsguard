options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion yes;
    forward only;
    forwarders { 172.30.0.20; };
    # Isolated acceptance only: do not turn this fixture into an open resolver.
    allow-query { 127.0.0.1; 172.30.0.1; 172.30.0.2; 172.30.0.10; 172.30.0.11; 172.30.0.12; };
    allow-recursion { 127.0.0.1; 172.30.0.1; 172.30.0.2; };
    allow-query-cache { 127.0.0.1; 172.30.0.1; 172.30.0.2; };
    dnssec-validation no;
    response-policy { zone "rpz.local"; zone "tld-deny.rpz.local"; };
};

logging {
    channel cluster_log {
        file "/var/log/bind/cluster.log" versions 3 size 5m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };
    category default { cluster_log; };
    category notify { cluster_log; };
    category xfer-in { cluster_log; };
};

zone "rpz.local" {
    type secondary;
    primaries { 172.30.0.10; };
    file "/var/lib/bind/secondary/rpz.local.zone";
    allow-notify { 172.30.0.10; };
};

zone "tld-deny.rpz.local" {
    type secondary;
    primaries { 172.30.0.10; };
    file "/var/lib/bind/secondary/tld-deny.rpz.local.zone";
    allow-notify { 172.30.0.10; };
};

zone "app.test" {
    type primary;
    file "/var/lib/bind/secondary/app.test.zone";
    allow-query { any; };
};
