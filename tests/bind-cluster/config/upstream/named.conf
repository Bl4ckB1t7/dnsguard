options {
    directory "/var/cache/bind";
    listen-on port 53 { any; };
    listen-on-v6 { none; };
    recursion no;
    allow-query { any; };
    dnssec-validation no;
};

logging {
    channel cluster_log {
        file "/var/log/bind/cluster.log" versions 3 size 5m;
        severity info;
        print-time yes;
        print-category yes;
        print-severity yes;
    };
    category default { cluster_log; };
};

zone "example.com" {
    type primary;
    file "/var/lib/bind/upstream/example.com.zone";
    allow-query { any; };
};
